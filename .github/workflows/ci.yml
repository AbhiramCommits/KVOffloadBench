name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Typecheck
        run: python -m mypy
      - name: Tests with coverage
        run: python -m pytest --cov=kvoffloadbench --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  smoke:
    name: emulated smoke sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run the 2-point emulated sweep
        run: make smoke PYTHON=python KVOB=kvoffloadbench
      - name: Show produced index
        run: cat results/index.csv
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: results/
          if-no-files-found: error
